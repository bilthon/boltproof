      <h1>boltproof — check whether a Lightning invoice was paid</h1>
      <p>boltproof checks a BOLT11 invoice in your browser. Paste the invoice and a preimage and it checks two things: that the invoice signature is valid, and that <code>sha256(preimage)</code> equals the payment hash inside the invoice.</p>
      <h2>What a match shows</h2>
      <p>A matching preimage shows the invoice was paid, not who paid. The recipient created the preimage, and anyone who knows it can present it. The signature authenticates the node that signed the invoice, not a payer. If the invoice has no amount, the preimage does not prove how much was paid.</p>
      <h2>Who it's for</h2>
      <p>Merchants and freelancers checking that a Lightning invoice was paid, and anyone comparing a BOLT11 invoice with a preimage.</p>
      <h2>Privacy</h2>
      <p>No account. Your invoice and preimage are checked in the browser and are never transmitted. The page loads fonts from Google Fonts; that request does not include them. JavaScript is required to use the tool.</p>
